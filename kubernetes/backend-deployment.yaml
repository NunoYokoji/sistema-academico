apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  # Escalabilidade (seção 19): duas réplicas atendidas pelo backend-service.
  # Para demonstrar: kubectl scale deployment backend --replicas=3
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: api
          image: sistema-academico/backend:1.0
          # A imagem é carregada no cluster com "kind load docker-image";
          # sem isto o kubelet tentaria buscá-la em um registro remoto.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sistema-academico-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sistema-academico-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
