apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: backend
spec:
  # ClusterIP: o back-end só é acessado de dentro do cluster, pelo nginx
  # do front-end, que faz proxy de /api para cá.
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
