# Ambiente local completo: front-end, back-end, Redis e banco de dados,
# cada um em seu próprio container (seção 14 do enunciado).
services:
  database:
    image: postgres:16-alpine
    container_name: sa-database
    environment:
      POSTGRES_DB: sistema_academico
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_academico"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sa-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: sistema-academico/backend:1.0
    container_name: sa-backend
    environment:
      PORT: "8080"
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: sistema_academico
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_TTL_SECONDS: "60"
      GIN_MODE: release
      SEED_ON_EMPTY: "true"
    ports:
      - "8081:8080"   # acesso direto à API, para os testes com curl
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: sistema-academico/frontend:1.0
    container_name: sa-frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  dados-postgres:
